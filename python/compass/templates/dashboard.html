<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>罗盘 · 看板</title>
<style>
  :root{
    --ink:#141821; --sub:#5b6472; --line:#e6e9ef; --bg:#f5f7fa; --card:#ffffff;
    --brand:#2f5cff; --brand-soft:#eef2ff; --good:#0f9d6e; --warn:#e07b00; --bad:#d9363e;
    --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 64px}

  /* header */
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
  .brand{display:flex;gap:12px;align-items:center}
  .mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#2f5cff,#7b9bff);
    display:grid;place-items:center;color:#fff;font-size:21px;box-shadow:0 6px 16px rgba(47,92,255,.28)}
  h1{font-size:22px;letter-spacing:.5px}
  .who{color:var(--sub);font-size:13px;margin-top:2px}
  .who b{color:var(--ink);font-weight:600}
  .stamp{color:var(--sub);font-size:12px;text-align:right;line-height:1.7}
  .stamp span{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:2px 10px;margin-left:6px}
  .navlink{font-size:13px;color:var(--brand);text-decoration:none;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:5px 14px;white-space:nowrap}
  .navlink:hover{border-color:#c9d2e3}

  /* kpi */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .label{font-size:12px;color:var(--sub);letter-spacing:.5px}
  .kpi .num{font-size:30px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
  .kpi .num small{font-size:13px;font-weight:500;color:var(--sub);margin-left:4px}
  .kpi.accent .num{color:var(--brand)}

  /* layout */
  .grid{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .panel h2{font-size:14px;letter-spacing:1px;color:var(--sub);padding:16px 18px 10px;font-weight:600}
  .panel .body{padding:0 18px 18px}

  /* today */
  .today-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .today-item:last-child{border-bottom:0}
  .dot{width:8px;height:8px;border-radius:50%;margin-top:8px;flex:0 0 8px}
  .dot.urgent{background:var(--bad)} .dot.interview{background:var(--good)}
  .dot.todo{background:var(--warn)} .dot.follow{background:#8b5cf6}
  .empty{color:var(--sub);font-size:13px;padding:6px 0}

  /* funnel */
  .funnel{display:flex;flex-direction:column;gap:9px}
  .frow{display:grid;grid-template-columns:58px 1fr 28px;align-items:center;gap:10px;font-size:12.5px;color:var(--sub)}
  .bar{height:9px;background:#eef1f6;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2f5cff,#7b9bff)}
  .frow .n{text-align:right;color:var(--ink);font-weight:600}

  /* filters */
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
  .chip{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;
    padding:5px 12px;font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap}
  .chip:hover{border-color:#c9d2e3;color:var(--ink)}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .search{margin-left:auto;display:flex;align-items:center;gap:6px;background:#f7f8fb;border:1px solid var(--line);
    border-radius:999px;padding:5px 12px;min-width:180px}
  .search input{border:0;outline:0;background:transparent;font-size:13px;width:100%;color:var(--ink)}
  select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:12.5px;color:var(--sub)}

  /* jobs */
  .jobs{padding:8px 14px 16px;display:flex;flex-direction:column;gap:10px}
  .job{border:1px solid var(--line);border-radius:12px;padding:14px;transition:.15s;background:#fff}
  .job:hover{border-color:#cfd8ea;box-shadow:0 6px 18px rgba(16,24,40,.06)}
  .jtop{display:flex;gap:14px;align-items:flex-start}
  .score{width:54px;flex:0 0 54px;text-align:center}
  .ring{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;
    background:conic-gradient(var(--c) calc(var(--p)*1%),#edf0f6 0);position:relative}
  .ring::after{content:"";position:absolute;inset:5px;background:#fff;border-radius:50%}
  .ring span{position:relative;z-index:1}
  .score small{display:block;font-size:10px;color:var(--sub);margin-top:3px;letter-spacing:.5px}
  .jmain{flex:1;min-width:0}
  .jtitle{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .jtitle b{font-size:15.5px;font-weight:650}
  .pri{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;letter-spacing:.5px}
  .pri.A{background:#e8f7f0;color:var(--good)} .pri.B{background:#fff4e5;color:var(--warn)} .pri.C{background:#f1f2f5;color:var(--sub)}
  .status{font-size:11.5px;padding:1px 8px;border-radius:999px;background:#f1f3f8;color:var(--sub)}
  .status.applied,.status.replied{background:#eef2ff;color:var(--brand)}
  .status.interview{background:#e8f7f0;color:var(--good)}
  .status.offer{background:#0f9d6e;color:#fff}
  .status.rejected,.status.dropped{background:#f4f4f6;color:#98a0ae}
  .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .tag{font-size:11.5px;color:var(--sub);background:#f6f7fa;border-radius:6px;padding:2px 7px}
  .tag.hot{background:var(--brand-soft);color:var(--brand)}
  .tag.risk{background:#fdecec;color:var(--bad)}
  .deadline{color:var(--bad);font-weight:600}
  .next{margin-top:8px;font-size:12.5px;color:var(--brand);background:var(--brand-soft);
    display:inline-block;padding:3px 9px;border-radius:7px}
  details{margin-top:9px;border-top:1px dashed var(--line);padding-top:9px}
  summary{cursor:pointer;font-size:12.5px;color:var(--sub);list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:#aab2c0}
  details[open] summary::before{content:"▾ "}
  .why{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;font-size:12.5px}
  .why h4{font-size:11.5px;letter-spacing:.5px;color:var(--sub);margin-bottom:4px;font-weight:600}
  .why ul{list-style:none;display:flex;flex-direction:column;gap:3px}
  .why li::before{content:"· ";color:#aab2c0}
  .why .gap li::before{content:"× ";color:var(--bad)}
  .jd{margin-top:10px;font-size:12.5px;color:var(--sub);white-space:pre-wrap;max-height:180px;overflow:auto;
    background:#fafbfd;border-radius:8px;padding:10px}
  .timeline{margin-top:10px;font-size:12px;color:var(--sub)}
  .timeline div{padding:2px 0}
  .timeline time{color:#98a0ae;margin-right:8px}
  .link{color:var(--brand);text-decoration:none;font-size:12.5px}
  .link:hover{text-decoration:underline}

  /* guide */
  .guide{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:20px 22px}
  .guide h2{font-size:14px;letter-spacing:1px;color:var(--sub);margin-bottom:12px}
  .guide .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .guide h3{font-size:13.5px;margin-bottom:5px}
  .guide p{font-size:12.5px;color:var(--sub)}
  code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;background:#f4f6fa;
    padding:2px 6px;border-radius:5px;color:#334}
  .phrase{display:block;margin-top:5px;color:#334}

  @media(max-width:900px){
    .grid{grid-template-columns:1fr}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .guide .cols{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">◈</div>
      <div>
        <h1>罗盘</h1>
        <div class="who" id="who"></div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:9px">
      <a class="navlink" href="{{EXPLORE_URL}}">不知道自己要什么？去探索 →</a>
      <div class="stamp" id="stamp"></div>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

  <div class="grid">
    <div>
      <section class="panel" style="margin-bottom:18px">
        <h2>今日待办</h2>
        <div class="body" id="today"></div>
      </section>
      <section class="panel">
        <h2>投递漏斗</h2>
        <div class="body"><div class="funnel" id="funnel"></div></div>
      </section>
    </div>

    <section class="panel">
      <div class="toolbar" id="toolbar"></div>
      <div class="jobs" id="jobs"></div>
    </section>
  </div>

  <section class="guide">
    <h2>怎么用 · Sapphire Jan 设计 · 全程不花产品方一分钱 token</h2>
    <div class="cols">
      <div>
        <h3>① 把岗位丢给它</h3>
        <p>在 WorkBuddy 里直接粘贴 JD、链接，或发截图：</p>
        <span class="phrase">「帮我记一个岗位：&lt;粘贴 JD&gt;」</span>
        <span class="phrase">「扫一下实习僧，杭州产品实习，2 页」</span>
      </div>
      <div>
        <h3>② 让它帮你判断和改简历</h3>
        <p>所有推理发生在你自己的 agent 里：</p>
        <span class="phrase">「这个岗位值得投吗？」</span>
        <span class="phrase">「按这个 JD 改一版简历」</span>
        <span class="phrase">「帮我写 BOSS 打招呼第一句」</span>
      </div>
      <div>
        <h3>③ 投了就说一声</h3>
        <p>状态和看板会自动更新：</p>
        <span class="phrase">「job_xxx 已投」</span>
        <span class="phrase">「今天要做什么？」</span>
        <span class="phrase">「生成看板」</span>
      </div>
    </div>
  </section>
</div>

<script id="payload" type="application/json">/*__DATA__*/</script>
<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const $ = (s, el=document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = (iso) => iso ? iso.slice(0,10) : '';
const daysLeft = (d) => {
  if (!d) return null;
  const t = new Date(d + 'T00:00:00');
  const n = new Date(); n.setHours(0,0,0,0);
  return Math.round((t - n) / 86400000);
};

const P = D.profile || {};
$('#who').innerHTML = [
  P.name ? `<b>${esc(P.name)}</b>` : '<b>未填写画像</b>',
  P.school ? esc(P.school) : '',
  P.major ? esc(P.major) : '',
  P.grade ? esc(P.grade) : ''
].filter(Boolean).join(' · ');

const target = (P.directions || []).join(' / ');
const cities = (P.cities || []).join(' / ');
$('#stamp').innerHTML = `${target || '未设方向'}<br>${cities || '未设城市'}
  <span>每周目标 ${D.stats.weekly_target} 投</span><br>
  <span>更新于 ${fmtDate(D.generated_at)} ${D.generated_at.slice(11,16)}</span>`;

// KPI
const S = D.stats;
$('#kpis').innerHTML = [
  ['岗位池', S.total, '个记录', 'accent'],
  ['已投递', S.applied, '份', ''],
  ['面试中', S.interview, S.offer ? `含 ${S.offer} 个 offer` : '暂无 offer', ''],
  ['本周投递', S.this_week, `/ ${S.weekly_target}`, 'accent'],
].map(([l,n,s,c]) => `<div class="kpi ${c}"><div class="label">${l}</div><div class="num">${n}<small>${s}</small></div></div>`).join('');

// today
if (!D.today.length) {
  $('#today').innerHTML = '<div class="empty">今天没有必须做的事。去翻翻新岗位，或者把投过的岗位状态更新一下。</div>';
} else {
  $('#today').innerHTML = D.today.map(t => `<div class="today-item"><span class="dot ${t.kind}"></span><span>${esc(t.text)}</span></div>`).join('');
}

// funnel
const order = ['new','shortlisted','tailored','applied','interview','offer'];
const maxN = Math.max(1, ...order.map(s => S.by_status[s] || 0));
$('#funnel').innerHTML = order.map(s => {
  const n = S.by_status[s] || 0;
  return `<div class="frow"><span>${D.status_label[s]}</span><div class="bar"><i style="width:${Math.round(n/maxN*100)}%"></i></div><span class="n">${n}</span></div>`;
}).join('');

// toolbar
let filter = 'all', pri = 'all', q = '';
const chips = [['all','全部'], ...D.status_order.map(s => [s, D.status_label[s]])]
  .filter(([s]) => s === 'all' || (S.by_status[s] || 0) > 0);
$('#toolbar').innerHTML = chips.map(([s,l]) =>
  `<button class="chip ${s==='all'?'on':''}" data-status="${s}">${l}${s!=='all'?` ${S.by_status[s]||0}`:''}</button>`
).join('') + `<select id="pri"><option value="all">全部优先级</option><option value="A">A 优先</option><option value="B">B 可投</option><option value="C">C 备选</option></select>
<div class="search"><input id="q" placeholder="搜公司 / 岗位 / 技能"></div>`;

function scoreColor(v){ return v>=75?'#0f9d6e':v>=55?'#e07b00':'#98a0ae'; }

function renderJobs(){
  const list = (D.jobs || []).filter(j => {
    if (filter !== 'all' && j.status !== filter) return false;
    if (pri !== 'all' && j.priority !== pri) return false;
    if (q) {
      const t = [j.company,j.title,j.city,(j.skills_hit||[]).join(' '),j.jd_raw].join(' ').toLowerCase();
      if (!t.includes(q.toLowerCase())) return false;
    }
    return true;
  }).sort((a,b) => (b.match_score||0) - (a.match_score||0));

  if (!list.length) {
    $('#jobs').innerHTML = '<div class="empty">没有符合条件的岗位。换个筛选，或者让 WorkBuddy 帮你加几个。</div>';
    return;
  }

  $('#jobs').innerHTML = list.map(j => {
    const left = daysLeft(j.deadline);
    const dl = left === null ? '' : left < 0 ? '<span class="tag risk">已截止</span>' :
      `<span class="tag ${left<=3?'deadline':''}">${left===0?'今天截止':`${left} 天后截止`}</span>`;
    const tags = [
      j.city ? `<span class="tag">${esc(j.city)}</span>` : '',
      j.salary ? `<span class="tag">${esc(j.salary)}</span>` : '',
      j.days_per_week ? `<span class="tag">每周 ${j.days_per_week} 天</span>` : '',
      j.duration_months ? `<span class="tag">${j.duration_months} 个月</span>` : '',
      j.degree ? `<span class="tag">${esc(j.degree)}</span>` : '',
      dl,
      ...(j.risk_flags||[]).map(r => `<span class="tag risk">风险：${esc(r)}</span>`),
      ...(j.skills_hit||[]).slice(0,4).map(s => `<span class="tag hot">${esc(s)}</span>`),
    ].filter(Boolean).join('');

    const why = (j.match_reasons||[]).map(x => `<li>${esc(x)}</li>`).join('') || '<li>暂无</li>';
    const gaps = (j.gaps||[]).map(x => `<li>${esc(x)}</li>`).join('') || '<li>暂无明显短板</li>';
    const events = (j.events||[]).slice(-5).reverse().map(e =>
      `<div><time>${fmtDate(e.at)}</time>${esc(e.note || e.to || e.type)}</div>`).join('');
    const link = j.url ? `<a class="link" href="${esc(j.url)}" target="_blank" rel="noopener">打开原岗位 ↗</a>` : '';

    return `<article class="job">
      <div class="jtop">
        <div class="score">
          <div class="ring" style="--p:${j.match_score||0};--c:${scoreColor(j.match_score||0)}"><span>${j.match_score||0}</span></div>
          <small>匹配</small>
        </div>
        <div class="jmain">
          <div class="jtitle">
            <b>${esc(j.title)}</b>
            <span class="pri ${j.priority||'C'}">${j.priority||'C'}</span>
            <span class="status ${j.status}">${D.status_label[j.status]||j.status}</span>
            ${link}
          </div>
          <div class="meta">
            <span class="tag" style="background:#fff;font-weight:600;color:var(--ink)">${esc(j.company)}</span>
            ${tags}
          </div>
          <div class="next">${esc(D.next_action[j.status]||'')}</div>
          <details>
            <summary>为什么是这个分 · 缺口 · 记录</summary>
            <div class="why">
              <div><h4>加分项</h4><ul>${why}</ul></div>
              <div class="gap"><h4>缺口 / 待确认</h4><ul>${gaps}</ul></div>
            </div>
            ${j.jd_raw ? `<div class="jd">${esc(j.jd_raw.slice(0,1200))}</div>` : ''}
            ${events ? `<div class="timeline">${events}</div>` : ''}
            <div class="timeline" style="margin-top:6px;color:#98a0ae">id: ${esc(j.id)} · 来源 ${esc(j.source||'未填')}</div>
          </details>
        </div>
      </div>
    </article>`;
  }).join('');
}

$('#toolbar').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  filter = b.dataset.status;
  [...document.querySelectorAll('.chip')].forEach(c => c.classList.toggle('on', c === b));
  renderJobs();
});
$('#toolbar').addEventListener('change', e => { if (e.target.id === 'pri') { pri = e.target.value; renderJobs(); } });
$('#toolbar').addEventListener('input', e => { if (e.target.id === 'q') { q = e.target.value; renderJobs(); } });

renderJobs();
</script>
</body>
</html>
